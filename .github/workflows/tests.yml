name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Validate the prebuilt cask
        env:
          TAP: ${{ steps.homebrew.outputs['tap-name'] }}
        run: |
          set -euo pipefail

          brew trust --cask "$TAP/qbittorrent"
          brew style "$TAP/qbittorrent"
          brew audit --cask "$TAP/qbittorrent"
          brew fetch --force --cask "$TAP/qbittorrent"
          brew install --cask "$TAP/qbittorrent"

          expected_version="$(brew info --json=v2 --cask "$TAP/qbittorrent" | jq -r '.casks[0].version')"
          actual_version="$("/Applications/qBittorrent.app/Contents/MacOS/qbittorrent" --version)"
          test "$actual_version" = "qBittorrent v$expected_version"
